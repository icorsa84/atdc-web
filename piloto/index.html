<script>
  // Lleva a la landing con el código del piloto (por defecto PILOTO; otro canal: /piloto/?c=CODIGO)
  (function () {
    var q = new URLSearchParams(location.search);
    var cod = (q.get('c') || q.get('piloto') || 'PILOTO').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 30) || 'PILOTO';
    q.delete('c'); q.set('piloto', cod);
    location.replace('/landing.html?' + q.toString());
  })();
</script>
